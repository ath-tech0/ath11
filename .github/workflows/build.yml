name: Build ATH External IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: ./build_unsigned.sh
        env:
      - run: ./build_esign_ready_ipa.sh build/ATH-External-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ATH-External-unsigned-ipa
          path: build/ATH-External-unsigned.ipa
